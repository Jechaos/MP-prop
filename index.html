<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PayNu</title>
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PayNu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<style>
:root{--bg:#f1f3f8;--ink:#14213d;--muted:#6b7488;--card:#ffffff;--brand:#3a5bff;--line:#dfe3ec;box-sizing:border-box;color-scheme:light;
--c-bg:#ffffff;--c-ink:#000000;--c-card:#f8f6f6;--c-sub:#6d6a69;--c-icbg:#e6e5eb;--c-icon:#3b3445;--c-x:#f9f9f9;--c-xline:#d7d7d7;--c-shadow:rgba(0,0,0,.08);--c-pill:#448550;--c-strip:#cccccc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0e1118;--ink:#eef1f8;--muted:#98a1b6;--card:#1a1f2b;--line:#2a3142;
--c-bg:#00041d;--c-ink:#ffffff;--c-card:#171a2f;--c-sub:#aeafb7;--c-icbg:#e6e4eb;--c-icon:#89848e;--c-x:#1e2342;--c-shadow:transparent;--c-xline:transparent;--c-pill:#54b475;--c-strip:#00020f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0e1118;--ink:#eef1f8;--muted:#98a1b6;--card:#1a1f2b;--line:#2a3142;
--c-bg:#00041d;--c-ink:#ffffff;--c-card:#171a2f;--c-sub:#aeafb7;--c-icbg:#e6e4eb;--c-icon:#89848e;--c-x:#1e2342;--c-shadow:transparent;--c-xline:transparent;--c-pill:#54b475;--c-strip:#00020f}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden;-webkit-user-select:none;user-select:none}
.view{position:fixed;inset:0;display:none}
.view.on{display:flex}

/* Menu */
#menu{flex-direction:column;justify-content:flex-start;align-items:center;overflow-y:auto;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));gap:14px}
.box{width:100%;max-width:360px;background:var(--card);border-radius:20px;padding:20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.logo{font-weight:800;font-size:24px;color:var(--brand);letter-spacing:-.3px}
.box label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.box input{width:100%;min-width:0;font:inherit;font-size:20px;padding:12px;border-radius:12px;border:1px solid var(--line);background:transparent;color:var(--ink)}
.start{border:0;background:var(--brand);color:#fff;font:inherit;font-size:17px;font-weight:700;padding:16px;border-radius:14px;cursor:pointer}
.start:focus-visible,.x:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.box{margin-top:auto;flex:none}
.note{margin-bottom:auto;flex:none;max-width:360px;color:var(--muted);font-size:12px;text-align:center;margin:0}

/* Kontrolskærm */
html:has(#ctrl.on),html:has(#ctrl.on) body{background:var(--c-strip)}
#ctrl{border-radius:42px 42px 56px 56px;background:var(--c-bg);color:var(--c-ink);overflow:hidden;flex-direction:column;align-items:center}
#bg{position:absolute;left:-160px;top:-160px;right:-160px;bottom:-160px;will-change:transform;pointer-events:none}
#bg span{position:absolute;font-size:48px;line-height:1;transform:translate(-50%,-50%)}
.top{pointer-events:none;position:absolute;left:0;right:0;top:0;height:calc(76px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;display:flex;align-items:center;justify-content:center;z-index:2}
.top h1{margin:0;font-size:17px;font-weight:600}
.x{z-index:3;position:absolute;left:16px;top:calc(16px + env(safe-area-inset-top,0px));width:44px;height:44px;border-radius:50%;border:1px solid var(--c-xline);background:var(--c-x);box-shadow:0 4px 18px var(--c-shadow);display:flex;align-items:center;justify-content:center;cursor:pointer}
.x svg{width:18px;height:18px;stroke:var(--c-ink)}
.card{position:relative;z-index:1;margin:auto 0;width:calc(100% - 64px);max-width:340px;background:var(--c-card);border-radius:20px;padding:32px 20px 40px;text-align:center;box-shadow:0 2px 12px var(--c-shadow)}
.pill{display:inline-block;background:var(--c-pill);color:#fff;font-weight:600;font-size:15px;padding:5px 12px;border-radius:20px;font-variant-numeric:tabular-nums}
.ic{width:64px;height:64px;margin:16px auto 10px;border-radius:14px;background:var(--c-icbg);display:flex;align-items:center;justify-content:center}
.ic svg{width:36px;height:36px;fill:var(--c-icon)}
.name{font-size:17px;font-weight:600;margin:0}
.sub{font-size:15px;color:var(--c-sub);margin:3px 0 0}
.sum{font-size:46px;font-weight:800;letter-spacing:-1.5px;margin:20px 0 0}
.sp{display:inline-block;width:.22em}
.emo{display:grid;gap:8px;font-size:13px;color:var(--muted)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.chips button{font:inherit;font-size:22px;line-height:1;height:40px;padding:0;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.chips button.rnd{grid-column:1/-1;font-size:14px;font-weight:600}
.chips button[aria-pressed="true"]{border-color:var(--brand);box-shadow:inset 0 0 0 2px var(--brand)}
.chips button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.dot{display:inline-block;width:.28em;height:.28em;border-radius:50%;background:currentColor;margin-left:.05em;vertical-align:baseline}
.theme{flex:none;display:flex;gap:4px;padding:4px;border-radius:14px;background:var(--card);border:1px solid var(--line);width:100%;max-width:360px}
.theme button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-size:14px;font-weight:600;padding:10px 6px;border-radius:10px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--brand);color:#fff}
.theme button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>

<main class="view on" id="menu">
  <div class="box">
    <div class="logo">PayNu</div>
    <label>Beløb i kr.<input id="iAmt" inputmode="decimal" value="38"></label>
    <label>Titel<input id="iName" value="Kantinen" autocomplete="off"></label>
    <label>Organisation<input id="iOrg" value="" placeholder="Valgfri" autocomplete="off"></label>
    <label>Nummer (#)<input id="iNum" inputmode="numeric" value="10001" autocomplete="off"></label>
    <div class="emo" role="group" aria-label="Baggrundsemoji">
      <span>Emoji i baggrunden</span>
      <div class="chips" id="chips"></div>
      <input id="iEmo" placeholder="Eller skriv din egen emoji" autocomplete="off" aria-label="Egen emoji">
    </div>
    <button class="start" id="go">Start kontrolbillede</button>
  </div>
  <div class="theme" id="theme" role="group" aria-label="Udseende">
    <button type="button" data-t="auto" aria-pressed="true">Auto</button>
    <button type="button" data-t="light" aria-pressed="false">Lys</button>
    <button type="button" data-t="dark" aria-pressed="false">Mørk</button>
  </div>
  <p class="note">Fiktiv app til filmbrug. Ingen rigtige betalinger. Luk kontrolbilledet med krydset for at komme tilbage hertil.</p>
</main>

<main class="view" id="ctrl">
  <div id="bg"></div>
  <div class="top"><h1>Kontrolbillede</h1></div>
  <button class="x" id="close" aria-label="Luk"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
  <div class="card">
    <div class="pill" id="pill">00:00</div>
    <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 3h16l2 5a3 3 0 0 1-5 2 3 3 0 0 1-5 0 3 3 0 0 1-5 0 3 3 0 0 1-5-2l2-5zM4 13h2v6h12v-6h2v8H4z"/></svg></div>
    <p class="name" id="oName">Kantinen</p>
    <p class="sub" id="oSub">#10001</p>
    <p class="sum" id="sum">38 kr.</p>
  </div>
</main>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var EMOJI=["🧦","🥑","🍕","🦆","🌵","🍩","🐢","🍒","🎈","🦊","🍋","🪁","🐙","🍄","🧀","🚲","🐝","🍉","🎸","🦋","⏱️"];
  var timer=null,t0=0,startSec=0,tx=0,ty=0,cx=0,cy=0,raf=null,listening=false;

  function parseTime(s){
    var p=(s||"").split(":").map(function(n){return parseInt(n,10)||0});
    return (p[0]||0)*3600+(p[1]||0)*60+(p[2]||0);
  }
  function fmt(sec){
    if(sec>=86400){var d=Math.floor(sec/86400);return d+(d===1?" dag":" dage")+" siden"}
    if(sec>=3600){var h=Math.floor(sec/3600);return h+(h===1?" time":" timer")+" siden"}
    var m=Math.floor(sec/60),s=sec%60;
    return (m<10?"0"+m:""+m)+":"+(s<10?"0"+s:""+s);
  }
  function buildBg(){
    var bg=$("bg"),e=choice||EMOJI[Math.floor(Math.random()*EMOJI.length)];
    bg.innerHTML="";
    // Lige raekker og kolonner med lidt variation (aendr tallene for mere/mindre)
    var w=window.innerWidth+320,h=window.innerHeight+320,dx=170,dy=144,vx=.09,vy=.08,sx=22; // sx = hvor meget hver raekke rykkes sidelæns (mere = mere diagonalt)
    for(var y=0,row=0;y<h+dy;y+=dy,row++){
      for(var x=((row*sx)%dx)-dx;x<w+dx;x+=dx){
        var s=document.createElement("span");
        var jx=(Math.random()*2-1)*dx*vx,jy=(Math.random()*2-1)*dy*vy;
        s.textContent=e;s.style.left=(x+jx).toFixed(1)+"px";s.style.top=(y+jy).toFixed(1)+"px";
        bg.appendChild(s);
      }
    }
  }
  function loop(){
    cx+=(tx-cx)*0.12;cy+=(ty-cy)*0.12;
    $("bg").style.transform="translate3d("+cx.toFixed(1)+"px,"+cy.toFixed(1)+"px,0)";
    raf=requestAnimationFrame(loop);
  }
  function clamp(v,a){return Math.max(-a,Math.min(a,v))}
  function onOrient(e){
    if(e.gamma==null)return;
    tx=clamp(e.gamma*0.7,24);
    ty=clamp(((e.beta||0)-45)*0.7,24);
  }
  function onPointer(e){
    var px=(e.clientX/window.innerWidth-.5)*2,py=(e.clientY/window.innerHeight-.5)*2;
    tx=clamp(-px*20,24);ty=clamp(-py*20,24);
  }
  function listen(){
    if(listening)return;listening=true;
    window.addEventListener("deviceorientation",onOrient);
    window.addEventListener("pointermove",onPointer);
  }
  var TKEY="paynu-tema",root=document.documentElement,meta=document.querySelector('meta[name="theme-color"]');
  function dark(t){return t==="dark"||(t!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)}
  function applyTheme(t){
    if(t==="light"||t==="dark")root.setAttribute("data-theme",t);else{t="auto";root.removeAttribute("data-theme")}
    var btns=document.querySelectorAll("#theme button");
    for(var i=0;i<btns.length;i++)btns[i].setAttribute("aria-pressed",btns[i].getAttribute("data-t")===t?"true":"false");
    paintBar(t);
  }
  function paintBar(t){
    if(!meta)return;
    var c=$("ctrl").classList.contains("on"),d=dark(t||getTheme());
    meta.setAttribute("content",d?(c?"#00020f":"#0e1118"):(c?"#cccccc":"#f1f3f8"));
  }
  function getTheme(){try{return localStorage.getItem(TKEY)||"auto"}catch(e){return"auto"}}
  function setTheme(t){try{localStorage.setItem(TKEY,t)}catch(e){}applyTheme(t)}
  $("theme").addEventListener("click",function(e){
    var b=e.target.closest&&e.target.closest("button[data-t]");if(b)setTheme(b.getAttribute("data-t"));
  });
  if(window.matchMedia){var mq=matchMedia("(prefers-color-scheme: dark)");
    var onMq=function(){if(getTheme()==="auto")applyTheme("auto")};
    if(mq.addEventListener)mq.addEventListener("change",onMq);else if(mq.addListener)mq.addListener(onMq)}
  applyTheme(getTheme());
  var choice="";
  function firstEmoji(str){
    try{
      var re=/\p{Extended_Pictographic}/u;
      if(window.Intl&&Intl.Segmenter){
        var it=new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(str)[Symbol.iterator](),n;
        while(!(n=it.next()).done){if(re.test(n.value.segment))return n.value.segment}
        return "";
      }
      var a=Array.from(str);for(var i=0;i<a.length;i++){if(re.test(a[i]))return a[i]}
      return "";
    }catch(e){return Array.from(str)[0]||""}
  }
  function paintChips(){
    var b=$("chips").children;
    for(var i=0;i<b.length;i++)b[i].setAttribute("aria-pressed",b[i].getAttribute("data-e")===choice?"true":"false");
  }
  function setChoice(e,fromLoad){
    choice=e||"";
    if(fromLoad&&choice&&EMOJI.indexOf(choice)<0)$("iEmo").value=choice;
    paintChips();
  }
  (function(){
    var c=$("chips"),r=document.createElement("button");
    r.type="button";r.className="rnd";r.setAttribute("data-e","");r.textContent="Tilf\u00e6ldig";c.appendChild(r);
    EMOJI.forEach(function(e){
      var b=document.createElement("button");b.type="button";b.setAttribute("data-e",e);b.textContent=e;c.appendChild(b);
    });
    c.addEventListener("click",function(ev){
      var b=ev.target.closest&&ev.target.closest("button");if(!b)return;
      $("iEmo").value="";setChoice(b.getAttribute("data-e"));
    });
    $("iEmo").addEventListener("input",function(){
      var g=firstEmoji(this.value);this.value=g;setChoice(g);
    });
    paintChips();
  })();
  var KEY="paynu-felter";
  function load(){
    try{
      var d=JSON.parse(localStorage.getItem(KEY)||"null");
      if(!d)return;
      if(d.amt!=null)$("iAmt").value=d.amt;
      if(d.name!=null)$("iName").value=d.name;
      if(d.org!=null)$("iOrg").value=d.org;
      if(d.num!=null)$("iNum").value=d.num;
      if(typeof d.emo==="string")setChoice(d.emo,true);
    }catch(e){}
  }
  function save(d){try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}}
  function open(){
    var a=($("iAmt").value||"0").replace(".",",").trim();
    var name=$("iName").value.trim(),org=$("iOrg").value.trim();
    var num=$("iNum").value.trim().replace(/^#+/,"");
    save({amt:$("iAmt").value,name:$("iName").value,org:$("iOrg").value,num:$("iNum").value,emo:choice});
    var sum=$("sum");sum.textContent=a;
    var sp=document.createElement("span");sp.className="sp";sp.setAttribute("aria-hidden","true");sum.appendChild(sp);
    sum.appendChild(document.createTextNode("kr"));
    var dot=document.createElement("span");dot.className="dot";dot.setAttribute("aria-hidden","true");
    sum.appendChild(dot);sum.setAttribute("aria-label",a+" kr.");
    $("oName").textContent=name;
    var parts=[];
    if(num)parts.push("#"+num);
    if(org)parts.push(org);
    $("oSub").textContent=parts.join(" \u2022 ");
    startSec=0;t0=Date.now();
    $("pill").textContent=fmt(startSec);
    buildBg();cx=cy=tx=ty=0;
    $("menu").classList.remove("on");$("ctrl").classList.add("on");paintBar();
    clearInterval(timer);
    timer=setInterval(function(){
      $("pill").textContent=fmt(startSec+Math.floor((Date.now()-t0)/1000));
    },250);
    cancelAnimationFrame(raf);loop();
  }
  function close(){
    clearInterval(timer);cancelAnimationFrame(raf);
    $("ctrl").classList.remove("on");$("menu").classList.add("on");paintBar();
  }
  $("go").addEventListener("click",function(){
    // iOS kraever tilladelse til bevaegelsessensor via et tryk
    if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function"){
      DeviceOrientationEvent.requestPermission().then(function(r){listen();open()}).catch(function(){listen();open()});
    }else{listen();open()}
  });
  $("close").addEventListener("click",close);
  load();
})();
</script>
<script>
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
</body>
</html>
